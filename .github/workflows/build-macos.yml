name: Build macOS preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:mac:${{ matrix.arch }}
      - name: Compute checksums
        run: shasum -a 256 dist/*.dmg dist/*.zip > dist/SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mineradio-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
